name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{"{{"}} github.head_ref || github.run_id {{"}}"}}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # uv reads .python-version and installs the interpreter automatically.
        run: uv sync

      - name: Restore pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{"{{"}} hashFiles('.pre-commit-config.yaml') {{"}}"}}
          restore-keys: |
            pre-commit-

      # We omit --hook-stage=manual so CI does not gate on pip-audit: an upstream CVE
      # would otherwise turn CI red with no code change. Dependabot handles vuln alerts;
      # run `uv run pre-commit run --hook-stage=manual --all-files` locally to audit.
      - name: pre-commit
        run: uv run pre-commit run --show-diff-on-failure --all-files

      - name: pytest
        run: uv run pytest
