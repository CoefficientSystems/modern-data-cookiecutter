# 🚨 THIS IS THE MODERN-DATA-COOKIECUTTER pyproject.toml — please double check you want to edit
# this file and not {{cookiecutter.repo_name}}/pyproject.template.toml
###########
# 📦 Project metadata (PEP 621)
###########
[project]
name = "modern-data-cookiecutter"
version = "0.2.2"
description = "Cookiecutter template for Coefficient modern data projects."
authors = [{ name = "John Sandall", email = "contact@coefficient.ai" }]
readme = "README.md"
requires-python = ">=3.12"
license = "UNLICENSED"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  # Everything below here is alphabetically sorted
  "cookiecutter>=2.6.0",
  "mypy>=1.3.0",
  "requests>=2.31.0",
]

[tool.uv]
# This repo is an application/template, not an installable library.
package = false

[dependency-groups]
# Everything below here is alphabetically sorted
dev = [
  "detect-secrets==1.5.0",
  "ipdb>=0.13.13",
  "pip-audit>=2.7.3",
  "pre-commit>=3.3.3",
  "pylint>=3.0.0",
  "pytest>=7.4.0",
  "pytest-cookies>=0.7.0",
  "ruff>=0.1.14",
  "towncrier>=23.11.0",
]

############
# ✅ Linters
############
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "A",
  "AIR",
  "ARG",
  "B",
  "C4",
  "C90",
  "COM",
  # "CPY",
  "D",
  "DJ",
  "DTZ",
  "E",
  # "E4", "E7", "E9",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FIX",
  "FLY",
  # "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  # "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TCH",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
    "INP001", # File `hooks/post_gen_project.py` is part of an implicit namespace package. Add an `__init__.py`.
    "PLR0133", # Two constants compared in a comparison, consider replacing `"{{ cookiecutter.use_github_actions }}" != "y"`
    "G004", # Logging statement uses f-string
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

##############
# 📣 Towncrier
##############
[tool.towncrier]
filename = "CHANGELOG.md"
directory = ".changelog/"
template = ".changelog/template.md"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/CoefficientSystems/modern-data-cookiecutter/issues/{issue})"
start_string = "<!-- TOWNCRIER -->\n"
underlines = ["", ""]

# .added for new features
# .changed for changes in existing functionality
# .deprecated for soon-to-be removed features
# .removed for now removed features
# .fixed for any bug fixes
# .security in case of vulnerabilities
# .analysis for data analyses
# .docs for documentation improvements
# .maintenance for maintenance tasks & upgrades
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "analysis"
name = "Analyses"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance Changes"
showcontent = true
