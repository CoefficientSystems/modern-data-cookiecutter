name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lint & test the cookiecutter template repo itself.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Restore pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      # We omit --hook-stage=manual so CI does not gate on pip-audit: an upstream CVE
      # would otherwise turn CI red with no code change. Dependabot handles vuln alerts;
      # run `uv run pre-commit run --hook-stage=manual --all-files` locally to audit.
      - name: pre-commit
        run: uv run pre-commit run --show-diff-on-failure --all-files

      - name: pytest
        run: uv run pytest --ignore='{{cookiecutter.repo_name}}'

  # Bake the template and run the *generated* project's checks end-to-end.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install template dependencies
        run: uv sync

      - name: Bake the cookiecutter
        run: uv run cookiecutter . --no-input --output-dir "${{ runner.temp }}/baked"

      - name: Create the generated project's environment
        working-directory: ${{ runner.temp }}/baked/example-project
        run: |
          git init -q
          git add -A
          uv sync

      - name: pytest (generated project)
        working-directory: ${{ runner.temp }}/baked/example-project
        run: uv run pytest

      - name: Towncrier (generated project)
        working-directory: ${{ runner.temp }}/baked/example-project
        run: |
          uv run towncrier create 123.added --content "Example news fragment."
          uv run towncrier build --version=999 --yes
          cat CHANGELOG.md

      - name: pre-commit (generated project)
        working-directory: ${{ runner.temp }}/baked/example-project
        run: |
          git add -A
          uv run pre-commit run --show-diff-on-failure --all-files
